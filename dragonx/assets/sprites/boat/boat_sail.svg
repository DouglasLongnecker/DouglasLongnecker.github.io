<svg width="200" height="180" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple sailboat - sailing (sails filled with wind) -->
  <!-- Hull -->
  <path d="M 40 140 L 20 160 L 180 160 L 160 140 Z" fill="#8b4513" stroke="#000" stroke-width="3"/>
  <path d="M 40 120 L 40 140 L 160 140 L 160 120 Z" fill="#a0522d" stroke="#000" stroke-width="3"/>

  <!-- Mast -->
  <rect x="95" y="30" width="10" height="110" fill="#654321" stroke="#000" stroke-width="2"/>

  <!-- Main Sail (filled with wind - curved) -->
  <path d="M 100 40 Q 145 85 100 130 L 160 130 Z" fill="#ffffff" stroke="#000" stroke-width="2.5" opacity="0.9"/>

  <!-- Front Sail (filled with wind - curved) -->
  <path d="M 100 50 Q 65 85 100 120 L 50 120 Z" fill="#f0f0f0" stroke="#000" stroke-width="2.5" opacity="0.85"/>

  <!-- Sail details (curved seams) -->
  <path d="M 100 60 Q 130 90 145 130" stroke="#ccc" stroke-width="1" fill="none"/>
  <path d="M 100 80 Q 120 100 135 130" stroke="#ccc" stroke-width="1" fill="none"/>
  <path d="M 100 100 Q 115 110 125 130" stroke="#ccc" stroke-width="1" fill="none"/>

  <!-- Flag (waving) -->
  <path d="M 100 30 Q 120 35 125 40 Q 115 42 100 45 Z" fill="#ff0000" stroke="#000" stroke-width="1.5"/>

  <!-- Water line effect -->
  <ellipse cx="100" cy="162" rx="85" ry="8" fill="#4a90e2" opacity="0.3"/>

  <!-- Water wake -->
  <path d="M 20 165 Q 40 163 60 165" stroke="#4a90e2" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 140 165 Q 160 163 180 165" stroke="#4a90e2" stroke-width="2" fill="none" opacity="0.5"/>
</svg>

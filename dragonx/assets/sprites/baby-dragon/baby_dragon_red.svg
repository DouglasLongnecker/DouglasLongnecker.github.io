<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Red Baby Dragon -->

  <!-- Body -->
  <ellipse cx="50" cy="60" rx="25" ry="20" fill="#cc0000" stroke="#990000" stroke-width="2"/>

  <!-- Head -->
  <circle cx="50" cy="35" r="18" fill="#cc0000" stroke="#990000" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="44" cy="32" r="4" fill="#ffffff"/>
  <circle cx="56" cy="32" r="4" fill="#ffffff"/>
  <circle cx="44" cy="32" r="2" fill="#000000"/>
  <circle cx="56" cy="32" r="2" fill="#000000"/>

  <!-- Horns -->
  <polygon points="42,20 40,12 44,18" fill="#ff6600" stroke="#990000" stroke-width="1"/>
  <polygon points="58,20 60,12 56,18" fill="#ff6600" stroke="#990000" stroke-width="1"/>

  <!-- Snout -->
  <ellipse cx="50" cy="42" rx="8" ry="5" fill="#ff6666" stroke="#990000" stroke-width="1"/>

  <!-- Nostrils -->
  <circle cx="47" cy="42" r="1.5" fill="#990000"/>
  <circle cx="53" cy="42" r="1.5" fill="#990000"/>

  <!-- Wings -->
  <path d="M 30 55 Q 15 50 20 65 Q 25 70 30 65 Z" fill="#ff3333" stroke="#990000" stroke-width="2"/>
  <path d="M 70 55 Q 85 50 80 65 Q 75 70 70 65 Z" fill="#ff3333" stroke="#990000" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 50 75 Q 55 85 50 95" stroke="#cc0000" stroke-width="8" fill="none" stroke-linecap="round"/>
  <polygon points="50,95 45,90 55,90" fill="#ff6600"/>

  <!-- Legs -->
  <rect x="38" y="75" width="6" height="12" fill="#cc0000" stroke="#990000" stroke-width="1" rx="2"/>
  <rect x="56" y="75" width="6" height="12" fill="#cc0000" stroke="#990000" stroke-width="1" rx="2"/>

  <!-- Feet -->
  <ellipse cx="41" cy="87" rx="4" ry="2" fill="#990000"/>
  <ellipse cx="59" cy="87" rx="4" ry="2" fill="#990000"/>
</svg>

<svg width="64" height="96" viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple boy character - walk frame 3 (right leg forward) -->
  <!-- Head -->
  <circle cx="32" cy="20" r="12" fill="#ffdbac" stroke="#000" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="28" cy="18" r="2" fill="#000"/>
  <circle cx="36" cy="18" r="2" fill="#000"/>
  <!-- Smile -->
  <path d="M 26 24 Q 32 26 38 24" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Body -->
  <rect x="22" y="32" width="20" height="30" rx="4" fill="#4a90e2" stroke="#000" stroke-width="2"/>
  <!-- Arms (swinging opposite) -->
  <rect x="14" y="30" width="10" height="20" rx="3" fill="#4a90e2" stroke="#000" stroke-width="2" transform="rotate(15 19 40)"/>
  <rect x="40" y="38" width="10" height="20" rx="3" fill="#4a90e2" stroke="#000" stroke-width="2" transform="rotate(-15 45 48)"/>
  <!-- Legs (walking position opposite) -->
  <rect x="20" y="62" width="8" height="28" rx="3" fill="#2c5aa0" stroke="#000" stroke-width="2" transform="rotate(-10 24 62)"/>
  <rect x="36" y="62" width="8" height="28" rx="3" fill="#2c5aa0" stroke="#000" stroke-width="2" transform="rotate(20 40 62)"/>
  <!-- Feet -->
  <ellipse cx="26" cy="92" rx="6" ry="4" fill="#8b4513" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="40" cy="88" rx="6" ry="4" fill="#8b4513" stroke="#000" stroke-width="1.5"/>
</svg>

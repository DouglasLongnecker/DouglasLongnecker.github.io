  <!-- Legs -->
  <rect x="24" y="62" width="8" height="28" rx="3" fill="#2c5aa0" stroke="#000" stroke-width="2"/>
  <rect x="32" y="62" width="8" height="28" rx="3" fill="#2c5aa0" stroke="#000" stroke-width="2"/>
  <!-- Feet -->

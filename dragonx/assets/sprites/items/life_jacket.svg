<svg width="80" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Life Jacket / Life Vest -->

  <!-- Main body (two panels) -->
  <path d="M 20 20 L 20 70 Q 25 75 30 75 L 30 80 Q 40 85 40 80 L 40 20 Z"
        fill="#ff6600" stroke="#cc5500" stroke-width="2"/>
  <path d="M 60 20 L 60 70 Q 55 75 50 75 L 50 80 Q 40 85 40 80 L 40 20 Z"
        fill="#ff6600" stroke="#cc5500" stroke-width="2"/>

  <!-- Collar -->
  <ellipse cx="40" cy="18" rx="22" ry="10" fill="#ff6600" stroke="#cc5500" stroke-width="2"/>

  <!-- Straps -->
  <rect x="35" y="30" width="10" height="3" fill="#333333"/>
  <rect x="35" y="45" width="10" height="3" fill="#333333"/>
  <rect x="35" y="60" width="10" height="3" fill="#333333"/>

  <!-- Buckles -->
  <circle cx="32" cy="31.5" r="2" fill="#888888"/>
  <circle cx="48" cy="31.5" r="2" fill="#888888"/>
  <circle cx="32" cy="46.5" r="2" fill="#888888"/>
  <circle cx="48" cy="46.5" r="2" fill="#888888"/>

  <!-- Reflective strips -->
  <rect x="22" y="25" width="4" height="15" fill="#ffff00" opacity="0.7"/>
  <rect x="54" y="25" width="4" height="15" fill="#ffff00" opacity="0.7"/>
  <rect x="22" y="50" width="4" height="15" fill="#ffff00" opacity="0.7"/>
  <rect x="54" y="50" width="4" height="15" fill="#ffff00" opacity="0.7"/>

  <!-- Whistle on cord -->
  <line x1="40" y1="18" x2="40" y2="12" stroke="#666666" stroke-width="1"/>
  <circle cx="40" cy="10" r="3" fill="#ff0000" stroke="#990000" stroke-width="1"/>
  <circle cx="40" cy="10" r="1" fill="#000000"/>
</svg>
